<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOIDRUNNER</title>
<style>
  :root{
    --bg:#05060d; --ink:#e8f4ff; --dim:#7d8ba8;
    --cy:#4ee2ff; --mg:#ff3d81; --yl:#ffd166; --vi:#c780ff; --gr:#5ef2a0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);
    -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;line-height:0}
  canvas{display:block;background:#05060d;border-radius:10px;
    box-shadow:0 0 0 1px #16203a, 0 0 70px -10px #4ee2ff40, 0 30px 80px -30px #000}
  .veil{position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:radial-gradient(ellipse at center,#05060de6 0%,#05060dfa 65%);
    border-radius:10px;padding:24px}
  .veil.on{display:grid}
  .panel{max-width:640px;display:grid;gap:18px;justify-items:center;line-height:1.5}
  h1{font-size:clamp(38px,7vmin,74px);letter-spacing:.22em;font-weight:800;
    background:linear-gradient(180deg,#fff,#4ee2ff 55%,#ff3d81);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 42px #4ee2ff30}
  h2{font-size:clamp(22px,4vmin,34px);letter-spacing:.16em;color:var(--mg);font-weight:800}
  .sub{color:var(--dim);letter-spacing:.18em;font-size:12px;text-transform:uppercase}
  .keys{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:13px;color:var(--dim);
    align-items:center;justify-items:start}
  .keys b{color:var(--ink);font-weight:700}
  kbd{display:inline-block;min-width:20px;padding:2px 7px;border-radius:5px;font:inherit;font-size:12px;
    background:#131c31;border:1px solid #2a3a5e;border-bottom-width:2px;color:var(--cy)}
  .btn{margin-top:4px;padding:12px 30px;border-radius:999px;font:inherit;font-weight:800;font-size:14px;
    letter-spacing:.18em;color:#05060d;background:linear-gradient(180deg,#8ceeff,#4ee2ff);cursor:pointer;
    border:0;box-shadow:0 0 30px -4px #4ee2ff80;transition:transform .12s ease,box-shadow .12s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 0 44px -2px #4ee2ffaa}
  .btn:active{transform:translateY(0)}
  .stats{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--dim)}
  .stats b{display:block;font-size:26px;color:var(--ink);letter-spacing:.06em;margin-top:2px}
  .best{color:var(--yl)}
  .hint{font-size:11px;color:#4a5773;letter-spacing:.1em}
  #mute{position:absolute;bottom:8px;right:12px;z-index:5;background:none;border:0;cursor:pointer;
    color:#3c4a68;font:inherit;font-size:16px;padding:6px}
  #mute:hover{color:var(--cy)}
  @media (max-width:760px){ .keys{display:none} }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game"></canvas>
  <button id="mute" title="Mute (M)">&#9835;</button>

  <div class="veil on" id="v-title"><div class="panel">
    <h1>VOIDRUNNER</h1>
    <div class="sub">arena survival &nbsp;&middot;&nbsp; how long can you hold the line?</div>
    <div class="keys">
      <b>WASD / &#8592;&#8593;&#8594;&#8595;</b><span>move</span>
      <b>Mouse</b><span>aim &mdash; hold to fire</span>
      <b><kbd>Space</kbd></b><span>dash (brief invulnerability)</span>
      <b><kbd>P</kbd> / <kbd>Esc</kbd></b><span>pause &nbsp;&middot;&nbsp; <kbd>M</kbd> mute</span>
    </div>
    <button class="btn" id="b-start">START</button>
    <div class="hint" id="t-best"></div>
  </div></div>

  <div class="veil" id="v-pause"><div class="panel">
    <h2>PAUSED</h2>
    <button class="btn" id="b-resume">RESUME</button>
    <div class="hint">press P to resume &nbsp;&middot;&nbsp; R to restart</div>
  </div></div>

  <div class="veil" id="v-dead"><div class="panel">
    <h2 id="d-title">SIGNAL LOST</h2>
    <div class="stats">
      <div>SCORE<b id="d-score">0</b></div>
      <div>WAVE<b id="d-wave">0</b></div>
      <div>KILLS<b id="d-kills">0</b></div>
      <div>BEST<b class="best" id="d-best">0</b></div>
    </div>
    <button class="btn" id="b-again">RUN IT BACK</button>
    <div class="hint">press R to restart</div>
  </div></div>
</div></div>

<script>
'use strict';
/* ============================================================
   VOIDRUNNER — single-file neon arena survival shooter
   ============================================================ */

const W = 1000, H = 640;                     // logical arena size
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let scale = 1;

function resize(){
  const pad = window.innerWidth < 760 ? 8 : 32;
  scale = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H);
  scale = Math.max(scale, 0.3);
  cvs.width  = Math.round(W * scale * DPR);
  cvs.height = Math.round(H * scale * DPR);
  cvs.style.width  = (W * scale) + 'px';
  cvs.style.height = (H * scale) + 'px';
  const st = document.getElementById('stage');
  st.style.width = (W * scale) + 'px';
  st.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; };
const hits  = (a, b) => dist2(a, b) < (a.r + b.r) * (a.r + b.r);

/* ---------- audio (procedural, no assets) ---------- */
const Snd = (() => {
  let ac = null, master = null, muted = false;
  function boot(){
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(ac.destination);
    return ac;
  }
  function tone(o){
    if (muted) return;
    const c = boot(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + o.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.02);
  }
  function noise(dur, vol, f){
    if (muted) return;
    const c = boot(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = f || 900;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start();
  }
  return {
    shoot(){ tone({ f0: 720, f1: 240, dur: 0.07, type: 'square', vol: 0.045 }); },
    hit(){   tone({ f0: 340, f1: 180, dur: 0.05, type: 'triangle', vol: 0.05 }); },
    boom(s){ noise(0.28 * (s || 1), 0.16 * (s || 1), 700); tone({ f0: 150, f1: 40, dur: 0.22, type:'sawtooth', vol: 0.07 }); },
    hurt(){  tone({ f0: 200, f1: 60,  dur: 0.30, type: 'sawtooth', vol: 0.13 }); noise(0.2, 0.12, 500); },
    dash(){  tone({ f0: 300, f1: 900, dur: 0.13, type: 'sine', vol: 0.07 }); },
    power(){ [0,1,2].forEach(i => tone({ f0: 520 + i*260, dur: 0.10, type:'square', vol: 0.07, delay: i*0.05 })); },
    wave(){  [0,1].forEach(i => tone({ f0: 300 + i*200, dur: 0.22, type:'triangle', vol: 0.08, delay: i*0.11 })); },
    dead(){  [0,1,2,3].forEach(i => tone({ f0: 420 - i*90, dur: 0.32, type:'sawtooth', vol: 0.10, delay: i*0.13 })); },
    toggle(){ muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return muted; },
    boot
  };
})();

/* ---------- input ---------- */
const keys = Object.create(null);
const mouse = { x: W/2, y: H/2 - 120, down: false };

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if (!keys[k]) {
    if (k === 'p' || k === 'escape') togglePause();
    if (k === 'm') setMuted(Snd.toggle());
    if (k === 'r' && (G.state === 'dead' || G.state === 'paused')) startGame();
    if ((k === 'enter' || k === ' ') && G.state === 'title') startGame();
  }
  keys[k] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false;
  if (G.state === 'playing') togglePause(); });

function toLocal(cx, cy){
  const r = cvs.getBoundingClientRect();
  return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
}
cvs.addEventListener('mousemove', e => { const p = toLocal(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
cvs.addEventListener('mousedown', e => { e.preventDefault(); Snd.boot(); mouse.down = true; });
addEventListener('mouseup',   () => { mouse.down = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());

/* touch: left half = move stick, right half = aim + fire */
const touchMove = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, on: false };
let isTouch = false;
function touchStart(e){
  isTouch = true; Snd.boot();
  for (const t of e.changedTouches) {
    const p = toLocal(t.clientX, t.clientY);
    if (p.x < W/2 && touchMove.id === null) {
      touchMove.id = t.identifier; touchMove.ox = p.x; touchMove.oy = p.y;
      touchMove.x = p.x; touchMove.y = p.y; touchMove.on = true;
    } else {
      mouse.x = p.x; mouse.y = p.y; mouse.down = true; mouse.tid = t.identifier;
    }
  }
  e.preventDefault();
}
function touchMoveH(e){
  for (const t of e.changedTouches) {
    const p = toLocal(t.clientX, t.clientY);
    if (t.identifier === touchMove.id) { touchMove.x = p.x; touchMove.y = p.y; }
    else if (t.identifier === mouse.tid) { mouse.x = p.x; mouse.y = p.y; }
  }
  e.preventDefault();
}
function touchEnd(e){
  for (const t of e.changedTouches) {
    if (t.identifier === touchMove.id) { touchMove.id = null; touchMove.on = false; touchMove.dx = touchMove.dy = 0; }
    if (t.identifier === mouse.tid) { mouse.down = false; mouse.tid = null; }
  }
  e.preventDefault();
}
cvs.addEventListener('touchstart', touchStart, { passive: false });
cvs.addEventListener('touchmove',  touchMoveH, { passive: false });
cvs.addEventListener('touchend',   touchEnd,   { passive: false });
cvs.addEventListener('touchcancel',touchEnd,   { passive: false });

/* ---------- game state ---------- */
const G = {
  state: 'title',            // title | playing | paused | dead
  t: 0, dt: 0,
  score: 0, kills: 0, wave: 0,
  mult: 1, multTimer: 0,
  shake: 0, hitstop: 0, flash: 0,
  best: +(localStorage.getItem('voidrunner.best') || 0)
};

let player, bullets, ebullets, enemies, spawns, parts, drops, floats, stars;

const PLAYER = {
  r: 12, speed: 268, fireRate: 0.135, bulletSpd: 660,
  dashSpd: 1180, dashTime: 0.13, dashCd: 0.62, maxHp: 3
};

const KIND = {
  drone:   { r: 13, hp: 2,  spd: 82,  score: 100, col: '#4ee2ff', touch: 1, sides: 6 },
  darter:  { r: 10, hp: 1,  spd: 205, score: 150, col: '#ffd166', touch: 1, sides: 3 },
  spitter: { r: 17, hp: 5,  spd: 62,  score: 250, col: '#c780ff', touch: 1, sides: 5, range: 250, cd: 1.55 },
  brute:   { r: 27, hp: 13, spd: 46,  score: 400, col: '#ff6b6b', touch: 2, sides: 4, splits: 3 },
  shard:   { r: 9,  hp: 2,  spd: 168, score: 80,  col: '#ff9d9d', touch: 1, sides: 3 },
  boss:    { r: 48, hp: 72, spd: 44,  score: 3000,col: '#ff3d81', touch: 2, sides: 8, cd: 1.5, boss: true }
};

const POWER = {
  rapid:  { col: '#4ee2ff', label: 'RAPID FIRE', dur: 9 },
  triple: { col: '#5ef2a0', label: 'TRI-SHOT',   dur: 9 },
  shield: { col: '#c780ff', label: 'SHIELD',     dur: 0 },
  heal:   { col: '#ff6b6b', label: '+1 HULL',    dur: 0 },
  nuke:   { col: '#ffd166', label: 'OVERLOAD',   dur: 0 }
};

function makeStars(){
  stars = [];
  for (let i = 0; i < 140; i++)
    stars.push({ x: rand(0,W), y: rand(0,H), z: rand(0.2,1), r: rand(0.4,1.6) });
}

function reset(){
  player = {
    x: W/2, y: H/2, vx: 0, vy: 0, r: PLAYER.r, a: -Math.PI/2,
    hp: PLAYER.maxHp, shield: 0, inv: 0,
    cool: 0, dashT: 0, dashCd: 0, rapid: 0, triple: 0, trail: 0
  };
  bullets = []; ebullets = []; enemies = []; spawns = [];
  parts = []; drops = []; floats = [];
  G.score = 0; G.kills = 0; G.wave = 0; G.mult = 1; G.multTimer = 0;
  G.shake = 0; G.hitstop = 0; G.flash = 0; G.t = 0;
  makeStars();
  waveTimer = 1.2; waveActive = false;
}

/* ---------- particles / juice ---------- */
function burst(x, y, n, col, spd, life, size){
  for (let i = 0; i < n; i++){
    const a = rand(0, TAU), s = rand(spd*0.25, spd);
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*0.5, life), max: life, col, r: rand(size*0.5, size) });
  }
}
function spark(x, y, a, n, col){
  for (let i = 0; i < n; i++){
    const ang = a + rand(-0.5, 0.5), s = rand(60, 260);
    parts.push({ x, y, vx: Math.cos(ang)*s, vy: Math.sin(ang)*s,
      life: rand(0.1,0.28), max: 0.28, col, r: rand(1,2.4) });
  }
}
function floater(x, y, text, col){
  floats.push({ x, y, text, col, life: 0.9, max: 0.9 });
}
function shake(v){ G.shake = Math.min(26, G.shake + v); }

/* ---------- scoring ---------- */
function addScore(base){
  G.score += Math.round(base * G.mult);
  G.multTimer = 2.6;
  if (G.mult < 8) G.mult = Math.min(8, G.mult + 0.25);
}

/* ---------- waves ---------- */
let waveTimer = 0, waveActive = false, waveBanner = 0, waveText = '';

function unlocked(w){
  const list = ['drone'];
  if (w >= 2) list.push('darter');
  if (w >= 3) list.push('spitter');
  if (w >= 5) list.push('brute');
  return list;
}
const COST = { drone: 1, darter: 1, spitter: 2, brute: 4 };

function startWave(){
  G.wave++;
  waveActive = true;
  const boss = G.wave % 5 === 0;
  waveText = boss ? 'WAVE ' + G.wave + ' — WARDEN' : 'WAVE ' + G.wave;
  waveBanner = 2.2;
  Snd.wave();

  if (boss){
    queueSpawn('boss', 0.8, 1 + Math.floor(G.wave / 10));
    queueSpawn('drone', 0.8, 3 + Math.floor(G.wave / 2));
    if (G.wave >= 10) queueSpawn('spitter', 1.6, 2);
    return;
  }
  let budget = 5 + G.wave * 2.9;
  const list = unlocked(G.wave);
  const plan = {};
  let guard = 0;
  while (budget > 0 && guard++ < 200){
    const k = pick(list);
    if (COST[k] > budget && budget < 4) break;
    plan[k] = (plan[k] || 0) + 1;
    budget -= COST[k];
  }
  let delay = 0.5;
  for (const k in plan){
    queueSpawn(k, delay, plan[k]);
    delay += 0.25;
  }
}

function queueSpawn(kind, delay, count){
  for (let i = 0; i < count; i++){
    const m = 60;
    let x, y;
    // spawn on a random edge band, never right on top of the player
    let tries = 0;
    do {
      const side = randi(0,3);
      if (side === 0){ x = rand(m, W-m); y = m; }
      else if (side === 1){ x = W-m; y = rand(m, H-m); }
      else if (side === 2){ x = rand(m, W-m); y = H-m; }
      else { x = m; y = rand(m, H-m); }
    } while (++tries < 12 && dist2({x,y}, player) < 240*240);
    spawns.push({ x, y, kind, t: delay + i * 0.14 + rand(0,0.2), max: 0.85 });
  }
}

function spawnEnemy(x, y, kind){
  const d = KIND[kind];
  enemies.push({
    x, y, vx: 0, vy: 0, kind, r: d.r, hp: d.hp * (1 + (G.wave-1) * 0.05),
    maxHp: d.hp * (1 + (G.wave-1) * 0.05),
    cd: d.cd ? rand(0.4, d.cd) : 0, a: rand(0, TAU), wob: rand(0, TAU),
    flash: 0, phase: 0
  });
}

/* ---------- update ---------- */
function update(dt){
  G.t += dt;

  /* --- player movement --- */
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy -= 1;
  if (keys['s'] || keys['arrowdown'])  iy += 1;
  if (touchMove.on){
    const dx = touchMove.x - touchMove.ox, dy = touchMove.y - touchMove.oy;
    const m = Math.hypot(dx, dy);
    if (m > 6){ const k = Math.min(1, m/60); ix = dx/m*k; iy = dy/m*k; }
  }
  const im = Math.hypot(ix, iy) || 1;
  if (im > 1){ ix /= im; iy /= im; }

  // dash
  player.dashCd = Math.max(0, player.dashCd - dt);
  const wantDash = keys[' '] || keys['shift'];
  if (wantDash && player.dashCd === 0 && player.dashT <= 0 && (ix || iy || true)){
    let dx = ix, dy = iy;
    if (!dx && !dy){ dx = Math.cos(player.a); dy = Math.sin(player.a); }
    const m = Math.hypot(dx, dy) || 1;
    player.dashT = PLAYER.dashTime; player.dashCd = PLAYER.dashCd;
    player.dvx = dx/m; player.dvy = dy/m;
    player.inv = Math.max(player.inv, PLAYER.dashTime + 0.09);
    Snd.dash(); shake(3);
    burst(player.x, player.y, 14, '#4ee2ff', 240, 0.3, 2.4);
  }

  if (player.dashT > 0){
    player.dashT -= dt;
    player.x += player.dvx * PLAYER.dashSpd * dt;
    player.y += player.dvy * PLAYER.dashSpd * dt;
    parts.push({ x: player.x, y: player.y, vx: 0, vy: 0, life: 0.24, max: 0.24,
      col: '#4ee2ff', r: 9 });
  } else {
    const sp = PLAYER.speed;
    player.vx = lerp(player.vx, ix * sp, 1 - Math.pow(0.0006, dt));
    player.vy = lerp(player.vy, iy * sp, 1 - Math.pow(0.0006, dt));
    player.x += player.vx * dt;
    player.y += player.vy * dt;
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);
  player.inv = Math.max(0, player.inv - dt);
  player.rapid = Math.max(0, player.rapid - dt);
  player.triple = Math.max(0, player.triple - dt);

  // aim + thruster
  player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.trail -= dt;
  if ((ix || iy) && player.trail <= 0){
    player.trail = 0.02;
    parts.push({ x: player.x - ix*10, y: player.y - iy*10,
      vx: -ix*70 + rand(-30,30), vy: -iy*70 + rand(-30,30),
      life: 0.3, max: 0.3, col: '#2f7dff', r: rand(1.5,3) });
  }

  /* --- firing --- */
  player.cool -= dt;
  const rate = PLAYER.fireRate * (player.rapid > 0 ? 0.48 : 1);
  if (mouse.down && player.cool <= 0){
    player.cool = rate;
    const spread = player.triple > 0 ? [-0.17, 0, 0.17] : [0];
    for (const off of spread){
      const a = player.a + off + rand(-0.02, 0.02);
      bullets.push({ x: player.x + Math.cos(a)*16, y: player.y + Math.sin(a)*16,
        vx: Math.cos(a)*PLAYER.bulletSpd, vy: Math.sin(a)*PLAYER.bulletSpd, r: 4, life: 1.4 });
    }
    spark(player.x + Math.cos(player.a)*16, player.y + Math.sin(player.a)*16, player.a, 3, '#bfefff');
    Snd.shoot();
    player.vx -= Math.cos(player.a) * 26;
    player.vy -= Math.sin(player.a) * 26;
  }

  /* --- multiplier decay --- */
  if (G.multTimer > 0){
    G.multTimer -= dt;
    if (G.multTimer <= 0 && G.mult > 1){ G.mult = 1; }
  }

  /* --- waves --- */
  if (!waveActive){
    waveTimer -= dt;
    if (waveTimer <= 0) startWave();
  } else if (enemies.length === 0 && spawns.length === 0){
    waveActive = false;
    waveTimer = 2.0;
    addScore(200 + G.wave * 50);
    floater(player.x, player.y - 40, 'WAVE CLEAR', '#5ef2a0');
  }
  if (waveBanner > 0) waveBanner -= dt;

  // spawn portals
  for (let i = spawns.length - 1; i >= 0; i--){
    const s = spawns[i];
    s.t -= dt;
    if (s.t <= -s.max){
      spawnEnemy(s.x, s.y, s.kind);
      burst(s.x, s.y, 12, KIND[s.kind].col, 200, 0.4, 2.5);
      spawns.splice(i, 1);
    }
  }

  /* --- player bullets --- */
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20){ bullets.splice(i,1); continue; }
    let gone = false;
    for (let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if (!hits(b, e)) continue;
      e.hp -= 1; e.flash = 0.09;
      e.vx += b.vx * 0.035; e.vy += b.vy * 0.035;
      spark(b.x, b.y, Math.atan2(b.vy, b.vx) + Math.PI, 4, KIND[e.kind].col);
      Snd.hit();
      bullets.splice(i,1); gone = true;
      if (e.hp <= 0) killEnemy(j);
      break;
    }
    if (gone) continue;
  }

  /* --- enemies --- */
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    const d = KIND[e.kind];
    e.flash = Math.max(0, e.flash - dt);
    const dx = player.x - e.x, dy = player.y - e.y;
    const dl = Math.hypot(dx, dy) || 1;
    const ux = dx/dl, uy = dy/dl;
    let ax = 0, ay = 0;

    if (e.kind === 'darter'){
      e.wob += dt * 7;
      const px = -uy, py = ux;
      ax = ux + px * Math.sin(e.wob) * 0.85;
      ay = uy + py * Math.sin(e.wob) * 0.85;
    } else if (e.kind === 'spitter'){
      const want = d.range;
      const push = dl > want + 30 ? 1 : (dl < want - 30 ? -1 : 0);
      ax = ux * push; ay = uy * push;
      e.cd -= dt;
      if (e.cd <= 0 && dl < want + 140){
        e.cd = d.cd;
        fireAt(e, 3, 0.20, 210, d.col);
      }
    } else if (e.kind === 'boss'){
      e.phase += dt;
      const want = 230;
      const push = dl > want ? 1 : -0.5;
      const px = -uy, py = ux;
      ax = ux * push + px * 0.6; ay = uy * push + py * 0.6;
      e.cd -= dt;
      if (e.cd <= 0){
        e.cd = d.cd;
        const n = 14;
        const base = rand(0, TAU);
        for (let k = 0; k < n; k++){
          const a = base + k * TAU / n;
          ebullets.push({ x: e.x + Math.cos(a)*e.r, y: e.y + Math.sin(a)*e.r,
            vx: Math.cos(a)*170, vy: Math.sin(a)*170, r: 6, life: 5, col: d.col });
        }
        fireAt(e, 3, 0.3, 240, '#ffd166');
        Snd.hit(); shake(4);
      }
    } else {
      ax = ux; ay = uy;
    }

    // separation so they don't stack into one blob
    for (let j = 0; j < enemies.length; j++){
      if (j === i) continue;
      const o = enemies[j];
      const ddx = e.x - o.x, ddy = e.y - o.y;
      const dd = ddx*ddx + ddy*ddy;
      const rr = (e.r + o.r) * 0.95;
      if (dd > 0.01 && dd < rr*rr){
        const m = Math.sqrt(dd);
        ax += (ddx/m) * 1.1; ay += (ddy/m) * 1.1;
      }
    }

    const am = Math.hypot(ax, ay) || 1;
    const spd = d.spd * (1 + Math.min(0.6, (G.wave-1) * 0.035));
    e.vx = lerp(e.vx, ax/am * spd, 1 - Math.pow(0.02, dt));
    e.vy = lerp(e.vy, ay/am * spd, 1 - Math.pow(0.02, dt));
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.x = clamp(e.x, e.r, W - e.r);
    e.y = clamp(e.y, e.r, H - e.r);
    e.a = Math.atan2(e.vy, e.vx);

    if (hits(e, player)) damagePlayer(d.touch, e);
  }

  /* --- enemy bullets --- */
  for (let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20){ ebullets.splice(i,1); continue; }
    if (hits(b, player)){
      ebullets.splice(i,1);
      damagePlayer(1, b);
    }
  }

  /* --- drops --- */
  for (let i = drops.length - 1; i >= 0; i--){
    const p = drops[i];
    p.life -= dt;
    p.bob += dt * 4;
    const dd = Math.sqrt(dist2(p, player));
    if (dd < 150){                      // magnet
      p.x += (player.x - p.x) / dd * 220 * dt;
      p.y += (player.y - p.y) / dd * 220 * dt;
    }
    if (p.life <= 0){ drops.splice(i,1); continue; }
    if (hits(p, player)){ takePower(p.kind); drops.splice(i,1); }
  }

  /* --- particles / floats --- */
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
  }
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y -= 32 * dt;
    if (f.life <= 0) floats.splice(i,1);
  }

  // stars drift
  for (const s of stars){
    s.y += (8 + s.z * 22) * dt;
    if (s.y > H){ s.y = 0; s.x = rand(0, W); }
  }

  G.shake *= Math.pow(0.02, dt);
  if (G.shake < 0.2) G.shake = 0;
  G.flash = Math.max(0, G.flash - dt * 3);
}

function fireAt(e, n, spread, spd, col){
  const a0 = Math.atan2(player.y - e.y, player.x - e.x);
  for (let k = 0; k < n; k++){
    const a = a0 + (k - (n-1)/2) * spread;
    ebullets.push({ x: e.x + Math.cos(a)*e.r, y: e.y + Math.sin(a)*e.r,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: 5, life: 4.5, col });
  }
}

/* ---------- kills, damage, powerups ---------- */
function killEnemy(idx){
  const e = enemies[idx];
  const d = KIND[e.kind];
  enemies.splice(idx, 1);
  G.kills++;
  addScore(d.score);
  floater(e.x, e.y - 8, '+' + Math.round(d.score * G.mult), d.col);
  burst(e.x, e.y, d.boss ? 70 : 16 + Math.round(e.r), d.col, d.boss ? 520 : 300,
        d.boss ? 0.9 : 0.5, d.boss ? 4 : 2.6);
  Snd.boom(d.boss ? 2.2 : 1);
  shake(d.boss ? 22 : 4 + e.r * 0.14);
  if (d.boss) G.flash = 1;

  if (d.splits){
    for (let i = 0; i < d.splits; i++){
      const a = rand(0, TAU);
      spawnEnemy(clamp(e.x + Math.cos(a)*26, 20, W-20), clamp(e.y + Math.sin(a)*26, 20, H-20), 'shard');
    }
  }

  // drops
  const roll = Math.random();
  const chance = d.boss ? 1 : (e.kind === 'brute' ? 0.35 : 0.075);
  if (roll < chance){
    let kind;
    if (player.hp < PLAYER.maxHp && Math.random() < 0.3) kind = 'heal';
    else kind = pick(['rapid','triple','shield','nuke','rapid','triple','shield']);
    drops.push({ x: e.x, y: e.y, r: 13, kind, life: 12, bob: rand(0, TAU) });
  }
}

function takePower(kind){
  const p = POWER[kind];
  Snd.power();
  floater(player.x, player.y - 34, p.label, p.col);
  burst(player.x, player.y, 20, p.col, 260, 0.5, 2.6);
  if (kind === 'rapid')  player.rapid  = p.dur;
  if (kind === 'triple') player.triple = p.dur;
  if (kind === 'shield') player.shield = Math.min(2, player.shield + 1);
  if (kind === 'heal')   player.hp = Math.min(PLAYER.maxHp, player.hp + 1);
  if (kind === 'nuke'){
    G.flash = 1; shake(20);
    ebullets.length = 0;
    for (let i = enemies.length - 1; i >= 0; i--){
      enemies[i].hp -= 6;
      if (enemies[i].hp <= 0) killEnemy(i);
      else { enemies[i].flash = 0.2; }
    }
    Snd.boom(2);
  }
}

function damagePlayer(amount, src){
  if (player.inv > 0 || G.state !== 'playing') return;
  // knock the attacker away so you don't get chain-hit
  if (src && src.vx !== undefined){
    const a = Math.atan2(src.y - player.y, src.x - player.x);
    src.vx += Math.cos(a) * 260; src.vy += Math.sin(a) * 260;
  }
  if (player.shield > 0){
    player.shield--;
    player.inv = 0.9;
    burst(player.x, player.y, 24, '#c780ff', 320, 0.5, 3);
    floater(player.x, player.y - 30, 'SHIELD DOWN', '#c780ff');
    Snd.hurt(); shake(9);
    return;
  }
  player.hp -= amount;
  player.inv = 1.25;
  G.mult = 1; G.multTimer = 0;
  G.flash = 0.85;
  burst(player.x, player.y, 30, '#ff6b6b', 380, 0.6, 3.2);
  Snd.hurt(); shake(16);
  G.hitstop = 0.07;
  if (player.hp <= 0) die();
}

function die(){
  player.hp = 0;
  G.state = 'dead';
  burst(player.x, player.y, 80, '#ff3d81', 560, 1.1, 4);
  burst(player.x, player.y, 50, '#ffd166', 340, 0.9, 3);
  shake(26); G.flash = 1;
  Snd.dead();
  if (G.score > G.best){
    G.best = G.score;
    localStorage.setItem('voidrunner.best', String(G.best));
    document.getElementById('d-title').textContent = 'NEW BEST';
    document.getElementById('d-title').style.color = 'var(--yl)';
  } else {
    document.getElementById('d-title').textContent = 'SIGNAL LOST';
    document.getElementById('d-title').style.color = 'var(--mg)';
  }
  document.getElementById('d-score').textContent = G.score.toLocaleString();
  document.getElementById('d-wave').textContent  = G.wave;
  document.getElementById('d-kills').textContent = G.kills;
  document.getElementById('d-best').textContent  = G.best.toLocaleString();
  setTimeout(() => { if (G.state === 'dead') veil('v-dead'); }, 900);
}

/* ---------- render ---------- */
function poly(x, y, r, sides, rot){
  ctx.beginPath();
  for (let i = 0; i < sides; i++){
    const a = rot + i * TAU / sides;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function render(){
  ctx.setTransform(scale*DPR, 0, 0, scale*DPR, 0, 0);
  const sx = G.shake ? rand(-G.shake, G.shake) : 0;
  const sy = G.shake ? rand(-G.shake, G.shake) : 0;
  ctx.clearRect(0, 0, W, H);

  // background
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(sx, sy);

  // stars
  for (const s of stars){
    ctx.globalAlpha = 0.18 + s.z * 0.5;
    ctx.fillStyle = s.z > 0.75 ? '#9fd8ff' : '#4b5f88';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // grid
  ctx.strokeStyle = '#0e1730';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 50){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 50){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // arena border
  ctx.strokeStyle = '#1d2d52';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W-2, H-2);

  ctx.globalCompositeOperation = 'lighter';

  // spawn telegraphs
  for (const s of spawns){
    if (s.t > 0) continue;
    const k = clamp(-s.t / s.max, 0, 1);
    const d = KIND[s.kind];
    ctx.strokeStyle = d.col;
    ctx.globalAlpha = 0.25 + k * 0.65;
    ctx.lineWidth = 2;
    poly(s.x, s.y, d.r * (2.2 - k * 1.2), d.sides, G.t * 3);
    ctx.stroke();
    ctx.globalAlpha = 0.12 + k * 0.2;
    ctx.fillStyle = d.col;
    ctx.beginPath(); ctx.arc(s.x, s.y, d.r * k, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // particles
  for (const p of parts){
    const k = p.life / p.max;
    ctx.globalAlpha = clamp(k, 0, 1) * 0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k * 0.8), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // drops
  for (const d of drops){
    const p = POWER[d.kind];
    const pulse = 1 + Math.sin(d.bob) * 0.12;
    const fade = d.life < 3 ? (0.35 + 0.65 * Math.abs(Math.sin(d.life * 8))) : 1;
    ctx.globalAlpha = fade;
    ctx.strokeStyle = p.col; ctx.lineWidth = 2.5;
    poly(d.x, d.y, d.r * pulse, 4, G.t * 1.6);
    ctx.stroke();
    ctx.globalAlpha = fade * 0.35;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.75 * pulse, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade * 0.55;
    ctx.strokeStyle = p.col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 1.55 + Math.sin(d.bob) * 2, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // enemy bullets
  for (const b of ebullets){
    ctx.fillStyle = b.col || '#ff8ab8';
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, TAU); ctx.fill();
  }

  // player bullets
  for (const b of bullets){
    ctx.strokeStyle = '#8ceeff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.022, b.y - b.vy*0.022); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.014, b.y - b.vy*0.014); ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';

  // enemies
  for (const e of enemies){
    const d = KIND[e.kind];
    const col = e.flash > 0 ? '#ffffff' : d.col;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.kind === 'darter' ? e.a : G.t * (d.boss ? 0.4 : 0.9) + e.wob);
    ctx.fillStyle = '#0a1020';
    poly(0, 0, e.r, d.sides, 0); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = d.boss ? 3.5 : 2.4;
    ctx.shadowColor = col; ctx.shadowBlur = d.boss ? 26 : 12;
    poly(0, 0, e.r, d.sides, 0); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = col;
    poly(0, 0, e.r * 0.62, d.sides, Math.PI / d.sides); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // boss health bar
    if (d.boss){
      const w = 110, hp = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = '#1a1030';
      ctx.fillRect(e.x - w/2, e.y - e.r - 20, w, 6);
      ctx.fillStyle = '#ff3d81';
      ctx.fillRect(e.x - w/2, e.y - e.r - 20, w * hp, 6);
    }
  }

  // player
  if (G.state !== 'dead'){
    const blink = player.inv > 0 && Math.floor(G.t * 22) % 2 === 0;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.a);
    ctx.globalAlpha = blink ? 0.4 : 1;

    if (player.shield > 0){
      ctx.strokeStyle = '#c780ff'; ctx.lineWidth = 2;
      ctx.globalAlpha = (blink ? 0.3 : 0.75);
      ctx.beginPath(); ctx.arc(0, 0, player.r + 8 + Math.sin(G.t*5)*1.5, 0, TAU); ctx.stroke();
      if (player.shield > 1){
        ctx.globalAlpha *= 0.6;
        ctx.beginPath(); ctx.arc(0, 0, player.r + 13, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = blink ? 0.4 : 1;
    }

    ctx.beginPath();
    ctx.moveTo(17, 0); ctx.lineTo(-11, -10); ctx.lineTo(-6, 0); ctx.lineTo(-11, 10);
    ctx.closePath();
    ctx.fillStyle = '#0b1428'; ctx.fill();
    ctx.strokeStyle = player.dashT > 0 ? '#ffffff' : '#4ee2ff';
    ctx.lineWidth = 2.4;
    ctx.shadowColor = '#4ee2ff'; ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = player.rapid > 0 || player.triple > 0 ? '#5ef2a0' : '#4ee2ff';
    ctx.beginPath(); ctx.arc(2, 0, 3.2, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // aim reticle
    if (!isTouch){
      ctx.strokeStyle = '#4ee2ff55'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
      ctx.moveTo(mouse.x + 5, mouse.y);  ctx.lineTo(mouse.x + 14, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5);
      ctx.moveTo(mouse.x, mouse.y + 5);  ctx.lineTo(mouse.x, mouse.y + 14);
      ctx.stroke();
    }
  }

  // floating text
  ctx.textAlign = 'center';
  for (const f of floats){
    const k = f.life / f.max;
    ctx.globalAlpha = clamp(k, 0, 1);
    ctx.fillStyle = f.col;
    ctx.font = '700 15px ui-monospace, Menlo, monospace';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // touch stick
  if (touchMove.on){
    ctx.strokeStyle = '#4ee2ff44'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(touchMove.ox, touchMove.oy, 48, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#4ee2ff33';
    const dx = clamp(touchMove.x - touchMove.ox, -48, 48);
    const dy = clamp(touchMove.y - touchMove.oy, -48, 48);
    ctx.beginPath(); ctx.arc(touchMove.ox + dx, touchMove.oy + dy, 20, 0, TAU); ctx.fill();
  }

  ctx.restore();
  drawHUD();

  // wave banner
  if (waveBanner > 0){
    const k = clamp(waveBanner / 2.2, 0, 1);
    const a = Math.min(1, k * 3) * Math.min(1, (1 - k) * 6 + 0.25);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8f4ff';
    ctx.font = '800 40px ui-monospace, Menlo, monospace';
    ctx.fillText(waveText, W/2, H/2 - 46);
    ctx.globalAlpha = 1;
  }

  // damage flash
  if (G.flash > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,60,110,' + (G.flash * 0.18).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawHUD(){
  ctx.textAlign = 'left';
  ctx.font = '700 13px ui-monospace, Menlo, monospace';

  // hull
  for (let i = 0; i < PLAYER.maxHp; i++){
    const on = i < player.hp;
    ctx.strokeStyle = on ? '#ff6b6b' : '#2a3550';
    ctx.fillStyle = on ? '#ff6b6b33' : 'transparent';
    ctx.lineWidth = 2;
    const x = 18 + i * 20, y = 20;
    ctx.beginPath();
    ctx.moveTo(x + 7, y); ctx.lineTo(x + 14, y + 7); ctx.lineTo(x + 7, y + 14); ctx.lineTo(x, y + 7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#4a5773';
  ctx.fillText('HULL', 18, 52);

  // score
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e8f4ff';
  ctx.font = '800 26px ui-monospace, Menlo, monospace';
  ctx.fillText(G.score.toLocaleString(), W - 18, 30);
  ctx.font = '700 11px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#4a5773';
  ctx.fillText('BEST ' + G.best.toLocaleString(), W - 18, 48);

  // wave
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7d8ba8';
  ctx.font = '700 13px ui-monospace, Menlo, monospace';
  ctx.fillText('WAVE ' + Math.max(1, G.wave), W/2, 26);

  // multiplier
  if (G.mult > 1){
    const k = clamp(G.multTimer / 2.6, 0, 1);
    ctx.fillStyle = '#ffd166';
    ctx.font = '800 18px ui-monospace, Menlo, monospace';
    ctx.fillText('x' + G.mult.toFixed(2).replace(/\.?0+$/, ''), W/2, 50);
    ctx.fillStyle = '#3a3320';
    ctx.fillRect(W/2 - 34, 56, 68, 3);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(W/2 - 34, 56, 68 * k, 3);
  }

  // dash meter
  const dw = 74, dx = 18, dy = 62;
  const k = 1 - player.dashCd / PLAYER.dashCd;
  ctx.fillStyle = '#16203a';
  ctx.fillRect(dx, dy, dw, 4);
  ctx.fillStyle = k >= 1 ? '#4ee2ff' : '#2a5f7a';
  ctx.fillRect(dx, dy, dw * clamp(k, 0, 1), 4);
  ctx.textAlign = 'left';
  ctx.fillStyle = k >= 1 ? '#4ee2ff' : '#3c4a68';
  ctx.font = '700 10px ui-monospace, Menlo, monospace';
  ctx.fillText('DASH', dx, dy + 16);

  // active powerups
  let py = H - 20;
  const show = [];
  if (player.rapid > 0)  show.push(['RAPID',  player.rapid  / POWER.rapid.dur,  '#4ee2ff']);
  if (player.triple > 0) show.push(['TRI',    player.triple / POWER.triple.dur, '#5ef2a0']);
  for (const [name, frac, col] of show){
    ctx.fillStyle = col;
    ctx.font = '700 11px ui-monospace, Menlo, monospace';
    ctx.fillText(name, 18, py);
    ctx.fillStyle = '#16203a';
    ctx.fillRect(52, py - 8, 52, 4);
    ctx.fillStyle = col;
    ctx.fillRect(52, py - 8, 52 * frac, 4);
    py -= 16;
  }
}

/* ---------- menus / flow ---------- */
function veil(id){
  for (const el of document.querySelectorAll('.veil')) el.classList.remove('on');
  if (id) document.getElementById(id).classList.add('on');
}
function setMuted(m){
  document.getElementById('mute').innerHTML = m ? '&#128263;' : '&#9835;';
  document.getElementById('mute').style.color = m ? '#ff6b6b' : '';
}
function startGame(){
  Snd.boot();
  reset();
  G.state = 'playing';
  veil(null);
}
function togglePause(){
  if (G.state === 'playing'){ G.state = 'paused'; veil('v-pause'); }
  else if (G.state === 'paused'){ G.state = 'playing'; veil(null); }
}
document.getElementById('b-start').onclick  = startGame;
document.getElementById('b-again').onclick  = startGame;
document.getElementById('b-resume').onclick = togglePause;
document.getElementById('mute').onclick     = () => setMuted(Snd.toggle());

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;                  // clamp after tab-out / stalls

  if (G.state === 'playing'){
    if (G.hitstop > 0){ G.hitstop -= dt; dt *= 0.15; }
    update(dt);
  } else if (G.state === 'dead'){
    // let the explosion play out
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0){ parts.splice(i,1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
    }
    G.shake *= Math.pow(0.02, dt);
    G.flash = Math.max(0, G.flash - dt * 1.5);
    G.t += dt;
  } else {
    G.t += dt;
    for (const s of stars){ s.y += (8 + s.z * 22) * dt; if (s.y > H){ s.y = 0; s.x = rand(0, W); } }
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
reset();
G.state = 'title';
document.getElementById('t-best').textContent = G.best ? 'BEST  ' + G.best.toLocaleString() : '';
requestAnimationFrame(frame);
</script>
